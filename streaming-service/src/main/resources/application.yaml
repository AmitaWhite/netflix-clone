spring:
  application:
    name: streaming-service
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers:
      - localhost:9092
    consumer:
      auto-offset-reset: earliest
      group-id: streaming-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: com.netflix.streamingservice.event.VideoEncodeEvent

#AWS Configuration
aws:
  access-key: ${AWS_ACCESS_KEY:my-access-key}
  secret-key: ${AWS_SECRET_KEY:my-secret-key}
  region: ${AWS_REGION:my-region}
  s3:
    bucket-name: ${AWS_BUCKET_NAME:abcdbucket}
    # Presigned URL expiry in minute
    presigned-url-expiry: 60

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include:
          - health, info
