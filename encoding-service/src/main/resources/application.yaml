spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: encoding-service
  kafka:
    consumer:
      group-id: encoding-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: com.netflix.encodingservice.event.VideoUploadedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
server:
  port: 8083
#AWS Configuration
aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket-name: ${AWS_BUCKET_NAME}
# FFmpeg Configuration
ffmpeg:
  path: ${FFMPEG_PATH:/usr/local/bin/ffmpeg}

# Temp directory for encoding
encoding:
  base-path: ${TEMP_DIR:/tmp/encoding}

management:
  endpoints:
    web:
      exposure:
        include: health, info
